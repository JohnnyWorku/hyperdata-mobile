name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.0"

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=${{ vars.API_BASE_URL || 'https://example.invalid/api' }}
          ONESIGNAL_APP_ID=${{ vars.ONESIGNAL_APP_ID || '00000000-0000-0000-0000-000000000000' }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=${{ vars.API_BASE_URL || 'https://example.invalid/api' }}
          ONESIGNAL_APP_ID=${{ vars.ONESIGNAL_APP_ID || '00000000-0000-0000-0000-000000000000' }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mahder-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
